<text x="1050" y="485" font-size="16" fill="#243444" font-weight="600" text-anchor="middle">V / Ω</text>
<circle cx="886" cy="509" r="10" fill="#172c3c"/>
<circle cx="1050" cy="509" r="10" fill="#c63830"/>
