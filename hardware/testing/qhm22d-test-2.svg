<rect x="836" y="283" width="273" height="95" rx="7" fill="#fafff1" stroke="#98a99c" stroke-width="2"/>
<text x="972" y="319" font-size="15" fill="#586b60" font-weight="600" text-anchor="middle">READ RESISTANCE</text>
<text x="972" y="358" font-size="35" fill="#253d31" font-weight="700" text-anchor="middle">Ω</text>
