<circle cx="486" cy="479" r="5" fill="#c63830"/>
<text x="350" y="357" font-size="20" fill="#172c3c" font-weight="600" text-anchor="start">Black: 3.5 mm sleeve</text>
<text x="48" y="560" font-size="20" fill="#b6312b" font-weight="600" text-anchor="start">Red: 2.5 mm tip</text>
<rect x="48" y="627" width="538" height="103" rx="12" fill="#eaf6ef"/>
<rect x="606" y="627" width="546" height="103" rx="12" fill="#fff1e7"/>
<text x="70" y="660" font-size="18" fill="#236240" font-weight="700" text-anchor="start">CORRECT / AFTER REPAIR</text>
<text x="70" y="706" font-size="35" fill="#236240" font-weight="700" text-anchor="start">≈ 8–9 Ω</text>
<text x="628" y="660" font-size="18" fill="#98451c" font-weight="700" text-anchor="start">REVERSED / BEFORE REPAIR</text>
<text x="628" y="706" font-size="35" fill="#98451c" font-weight="700" text-anchor="start">≈ 0 Ω</text>
<text x="48" y="766" font-size="19" fill="#243444" font-weight="400" text-anchor="start">Use the numeric Ω reading: a continuity buzzer can beep at both 0 Ω and 8 Ω.</text>
<text x="48" y="797" font-size="17" fill="#537080" font-weight="400" text-anchor="start">Not to scale. Probe colours may be exchanged; the CONTACT PAIR is what matters.</text>
</g></svg>