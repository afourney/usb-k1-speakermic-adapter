<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<title>QHM22D resistance test 2: Tip to sleeve</title>
<desc>Disconnect the handset from all equipment and hold PTT1. Black probe on the 3.5 mm sleeve. Red probe on the 2.5 mm tip. Correct wiring reads ≈ 8–9 Ω; the reversed unit reads ≈ 0 Ω. These drawings show the radio-end plugs, not the handset headphone jack.</desc>
<rect width="1200" height="820" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="48" y="53" font-size="18" fill="#537080" font-weight="600" text-anchor="start">BTECH QHM22D  /  WIRING CHECK</text>
<text x="48" y="103" font-size="36" fill="#243444" font-weight="700" text-anchor="start">Test 2 · Tip to sleeve</text>
<rect x="48" y="130" width="1104" height="76" rx="10" fill="#eef4f8"/>
<text x="68" y="160" font-size="22" fill="#243444" font-weight="700" text-anchor="start">UNPLUG EVERYTHING · Meter on Ω · Hold PTT1 throughout</text>
<text x="68" y="190" font-size="18" fill="#243444" font-weight="400" text-anchor="start">PTT1 = the button that switches the 3.5 mm sleeve. Use the SAME button for both tests.</text>
<text x="48" y="239" font-size="17" fill="#537080" font-weight="600" text-anchor="start">RADIO-END PLUGS</text>
<text x="795" y="239" font-size="17" fill="#537080" font-weight="600" text-anchor="start">MULTIMETER · RESISTANCE</text>
<path d="M48 382H95" stroke="#344452" stroke-width="20"/>
<rect x="95" y="275" width="135" height="220" rx="18" fill="#344452"/>
<text x="108" y="307" font-size="20" fill="white" font-weight="600" text-anchor="start">3.5 mm</text>
<rect x="230" y="274.0" width="174" height="52" fill="#c8d2d9" stroke="#657886" stroke-width="2"/>
<rect x="416" y="274.0" width="76" height="52" fill="#c8d2d9" stroke="#657886" stroke-width="2"/>
<rect x="404" y="274.0" width="12" height="52" fill="#263746"/>
<rect x="492" y="274.0" width="12" height="52" fill="#263746"/>
<path d="M504 274.0H550L586 300L550 326.0H504Z" fill="#c8d2d9" stroke="#657886" stroke-width="2"/>
<text x="316" y="260.0" font-size="17" fill="#344452" font-weight="600" text-anchor="middle">SLEEVE</text>
<text x="455" y="260.0" font-size="17" fill="#344452" font-weight="600" text-anchor="middle">RING</text>
<text x="548" y="260.0" font-size="17" fill="#344452" font-weight="600" text-anchor="middle">TIP</text>
<text x="108" y="467" font-size="20" fill="white" font-weight="600" text-anchor="start">2.5 mm</text>
<g transform="translate(230 0) scale(0.8 1) translate(-230 0)">
<rect x="230" y="441.0" width="174" height="38" fill="#c8d2d9" stroke="#657886" stroke-width="2"/>
<rect x="416" y="441.0" width="76" height="38" fill="#c8d2d9" stroke="#657886" stroke-width="2"/>
<rect x="404" y="441.0" width="12" height="38" fill="#263746"/>
<rect x="492" y="441.0" width="12" height="38" fill="#263746"/>
<path d="M504 441.0H550L586 460L550 479.0H504Z" fill="#c8d2d9" stroke="#657886" stroke-width="2"/>
</g>
<text x="298.8" y="427.0" font-size="17" fill="#344452" font-weight="600" text-anchor="middle">SLEEVE</text>
<text x="410.0" y="427.0" font-size="17" fill="#344452" font-weight="600" text-anchor="middle">RING</text>
<text x="484.4" y="427.0" font-size="17" fill="#344452" font-weight="600" text-anchor="middle">TIP</text>
